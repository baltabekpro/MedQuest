      summary: Delete Patient
      operationId: delete_patient_patients__patient_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requests:
    get:
      tags:
      - Requests
      summary: List Requests
      operationId: list_requests_requests_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: assigned_doctor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assigned Doctor Id
      - name: patient_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Patient Id
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 5
            minimum: 1
          - type: 'null'
          title: Priority
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_PatientRequestResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Requests
      summary: Create Request
      operationId: create_request_requests_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRequestCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requests/{request_id}:
    get:
      tags:
      - Requests
      summary: Get Request
      operationId: get_request_requests__request_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Requests
      summary: Update Request
      operationId: update_request_requests__request_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRequestUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Requests
      summary: Delete Request
      operationId: delete_request_requests__request_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
          title: Request Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requests/{request_id}/status:
    patch:
      tags:
      - Requests
      summary: Change Request Status
      operationId: change_request_status_requests__request_id__status_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requests/{request_id}/assign:
    patch:
      tags:
      - Requests
      summary: Assign Doctor
      operationId: assign_doctor_requests__request_id__assign_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDoctorRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dashboard/stats:
    get:
      tags:
      - Dashboard
      summary: Stats
      operationId: stats_dashboard_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
      security:
      - HTTPBearer: []
  /audit/logs:
    get:
      tags:
      - Audit
      summary: List Audit Logs
      operationId: list_audit_logs_audit_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Type
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date To
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AuditLogResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssignDoctorRequest:
      properties:
        doctor_id:
          type: integer
          title: Doctor Id
      type: object
      required:
      - doctor_id
      title: AssignDoctorRequest
    AuditLogResponse:
      properties:
        id:
          type: integer
          title: Id
        user_id:
          type: integer
          title: User Id
        user_full_name:
          type: string
          title: User Full Name
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        action:
          type: string
          title: Action
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: integer
          title: Entity Id
        details:
          additionalProperties: true
          type: object
          title: Details
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - id
      - user_id
      - user_full_name
      - ip_address
      - action
      - entity_type
      - entity_id
      - details
      - timestamp
      title: AuditLogResponse
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          minLength: 6
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
    ChangeStatusRequest:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: ChangeStatusRequest
    DashboardStats:
      properties:
        total_patients:
          type: integer
          title: Total Patients
        total_requests:
          type: integer
          title: Total Requests
        requests_new:
          type: integer
          title: Requests New
        requests_in_progress:
          type: integer
          title: Requests In Progress
        requests_closed:
          type: integer
          title: Requests Closed
        requests_closed_today:
          type: integer
          title: Requests Closed Today
      type: object
      required:
      - total_patients
      - total_requests
      - requests_new
      - requests_in_progress
      - requests_closed
      - requests_closed_today
      title: DashboardStats
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginEventResponse:
      properties:
        id:
          type: integer
          title: Id
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
        success:
          type: boolean
          title: Success
      type: object
      required:
      - id
      - user_id
      - timestamp
      - ip_address
      - user_agent
      - success
      title: LoginEventResponse
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    PaginatedResponse_AuditLogResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - items
      - total
      - page
      - limit
      title: PaginatedResponse[AuditLogResponse]
    PaginatedResponse_PatientRequestResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PatientRequestResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - items
      - total
      - page
      - limit
      title: PaginatedResponse[PatientRequestResponse]
    PaginatedResponse_PatientResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PatientResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - items
      - total
      - page
      - limit
      title: PaginatedResponse[PatientResponse]
    PaginatedResponse_UserResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - items
      - total
      - page
      - limit
      title: PaginatedResponse[UserResponse]
    PatientCreate:
      properties:
        full_name:
          type: string
          title: Full Name
        birth_date:
          type: string
          format: date
          title: Birth Date
        phone:
          type: string
          title: Phone
        email:
          anyOf:
          - type: string
            format: email
