<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MedQuest CRM - Create Request</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6324eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#161121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display">
<!-- Background Content (Dimmed Requests List) -->
<div class="fixed inset-0 z-0 p-8 overflow-hidden opacity-40 select-none pointer-events-none">
<div class="max-w-6xl mx-auto space-y-6">
<div class="flex justify-between items-center mb-8">
<div class="h-8 w-48 bg-slate-300 dark:bg-slate-700 rounded"></div>
<div class="h-10 w-32 bg-primary rounded-lg"></div>
</div>
<div class="grid grid-cols-1 gap-4">
<div class="h-20 w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"></div>
<div class="h-20 w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"></div>
<div class="h-20 w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"></div>
<div class="h-20 w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"></div>
<div class="h-20 w-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay px-4">
<!-- Modal Container -->
<div class="bg-white dark:bg-slate-900 w-full max-w-[600px] rounded-xl shadow-2xl flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Создать запрос</h2>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-6 py-6 overflow-y-auto max-h-[75vh] custom-scrollbar space-y-5">
<!-- Patient Select -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Пациент <span class="text-red-500">*</span></label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">search</span>
<select class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all appearance-none">
<option value="">Поиск пациента...</option>
<option value="1">Иванов Александр Петрович (1985)</option>
<option value="2">Смирнова Елена Викторовна (1992)</option>
<option value="3">Кузнецов Дмитрий Игоревич (1978)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">unfold_more</span>
</div>
</div>
<!-- Title Input -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Заголовок <span class="text-red-500">*</span></label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="Введите краткое название запроса" type="text"/>
</div>
<!-- Description Textarea -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Описание <span class="text-red-500">*</span></label>
<textarea class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400 resize-none" placeholder="Подробно опишите симптомы или требования..." rows="4"></textarea>
</div>
<!-- Two columns for Priority and Status -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Priority Selector -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Приоритет</label>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors font-medium" type="button">1</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors font-medium" type="button">2</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary text-white border border-primary shadow-lg shadow-primary/20 font-semibold" type="button">3</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors font-medium" type="button">4</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors font-medium" type="button">5</button>
</div>
</div>
<!-- Status Segmented Control -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Статус</label>
<div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700">
<button class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-white dark:bg-slate-700 text-primary shadow-sm ring-1 ring-slate-200 dark:ring-slate-600" type="button">Новый</button>
<button class="flex-1 py-1.5 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" type="button">В работе</button>
<button class="flex-1 py-1.5 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" type="button">Архив</button>
</div>
</div>
</div>
<!-- Doctor Assignment -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Назначить врача (опционально)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">medical_services</span>
<select class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all appearance-none">
<option value="">Выберите врача...</option>
<option value="d1">Д-р Васильев А.С. (Терапевт)</option>
<option value="d2">Д-р Морозова К.В. (Кардиолог)</option>
<option value="d3">Д-р Соколов М.Н. (Хирург)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3">
<button class="px-5 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors border border-slate-200 dark:border-slate-700">
                    Отмена
                </button>
<button class="px-6 py-2.5 text-sm font-semibold text-white bg-primary hover:bg-primary/90 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
<span>Создать запрос</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
